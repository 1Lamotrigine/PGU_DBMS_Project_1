# This project uses your LOCAL PostgreSQL by default (see backend/.env).
# The `docker` profile below is optional: run it only if you don't have a
# local Postgres and want a containerized one instead:
#
#   docker compose --profile docker up -d
#
# Adminer (web UI to browse the database) runs in the `tools` profile:
#
#   docker compose --profile tools up -d
#   open http://localhost:8080
#
services:
  db:
    profiles: ["docker"]
    image: postgres:16
    container_name: english_quest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: english_quest
    ports:
      - "5435:5432"
    volumes:
      - english_quest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d english_quest"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    profiles: ["tools"]
    image: adminer:latest
    container_name: english_quest_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  english_quest_data:
